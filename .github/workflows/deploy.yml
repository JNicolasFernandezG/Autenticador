name: CI/CD Deploy Autenticador (8086)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Actualizar Contenedor Autenticador en Linux
    # Si usás el Runner instalado en el servidor Linux (serverportable), dejá `self-hosted`.
    # Si usás conexión por SSH desde la nube de GitHub, cambiá a `ubuntu-latest`.
    runs-on: self-hosted

    steps:
      - name: Desplegar en /home/serverportable/Documentos/Autenticador
        run: |
          cd /home/serverportable/Documentos/Autenticador
          git fetch origin main
          git reset --hard origin/main
          # Asegura que la base de datos aislada esté encendida (no la reinicia ni borra si ya corre)
          docker compose -f docker-compose.db.yml up -d
          # Reconstruye y actualiza únicamente el Autenticador (Caddy :8086 + Backend + Frontend)
          docker compose up -d --build --remove-orphans
          docker image prune -f
