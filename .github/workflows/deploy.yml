name: CI/CD Deploy Autenticador (8086)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Actualizar Contenedor Autenticador en Linux
    runs-on: self-hosted

    steps:
      - name: Desplegar en servidor Linux (serverportable)
        run: |
          if [ -d "/home/serverportable/Documentos/Autenticador/Autenticador/.git" ]; then
            cd /home/serverportable/Documentos/Autenticador/Autenticador
          else
            cd /home/serverportable/Documentos/Autenticador
          fi
          git fetch origin main
          git reset --hard origin/main
          docker compose -f docker-compose.db.yml up -d
          docker compose up -d --build --remove-orphans
          docker image prune -f
